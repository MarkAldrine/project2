    <meta name="Description" content="OFFICIAL SITE OF JAMBAZZ FOOTBALL CLUB">
    <meta name="Keywords" content="Jambazz, Kaye, football club">
    <title>Academy|Player recruitment|Jambazz FC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image" href="logo.jpeg">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script type="text/javascript" src="index.js"></script>
    
    <style>
        body{
            background-image: url(image1.avif);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>

<body>
    <nav>
        <img src="logo.jpeg">
        <div class="nav-links">
            <ul>
                <li><a href="index.html">Homepage</a></li>
                <li><a href="About.html">About The Club</a></li>
                <li><a href="Login-form.html">Join Us</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <div class="header" style="color: blue;">JAMBAZZ FC- ACADEMY PLAYER RECRUITMENT</div><br><br>

        <form>
            <div class="form-group">
                <label>PLAYER NAME<span class="required">*</span></label><br>
                <div class="row">
                    <input type="text" placeholder="First name" required="required" >
                    <input type="text" placeholder="Last name"><br><br>
                </div>
            </div>

            <div class="form group">
                <label>Player Date of Birth<span class="required">*</span></label><br>
                <input type="date"><br><br>
            </div>

            <div class="form group">
                <label>Player Nationality<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Player Current Location<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Village<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>County<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Parish<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Contact name for parent/guardian over 18 years of age<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Contact email for parent/guardian over 18 years of age<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Player contact email<span class="required">*</span></label><br>
                <input type="text" id="email" placeholder="myemail@gmail.com"><br><br>
            </div>

            <div class="form group">
                <label>Contact telephone for parent/guardian over 18 years of age<span class="required">*</span></label><br>
                <input type="tel" id="phone" placeholder="+256123456789"><br><br>
            </div>

            <div class="form group">
                <label>Level of previous playing experience<span class="required">*</span></label><br>
                <select class="styled-select">
                    <option value="">Select level</option>
                    <option>Grassroots</option>
                    <option>English Academy</option>
                    <option>International Academy</option>
                    <option>Others</option>
                </select><br><br>
            </div>

            <div class="form group">
                <label>Please provide some details of this experience<span class="required">*</span></label><br>
                <input type="text"><br><br>
            </div>

            <div class="form group">
                <label>Preferred position</label><br>
                <select class="styled-select">
                    <option value="select position"></option>
                    <option>Goalkeeper</option>
                    <option>Right-back</option>
                    <option>Central defender</option>
                    <option>Left-back</option>
                    <option>Central-Midfield</option>
                    <option>Right-wing</option>
                    <option>Left-wing</option>
                    <option>Number 10</option>
                    <option>Centre-Forward</option>
                </select><br><br>
            </div>

            <div class="form group">
                <label>Dominant foot</label><br>
                <select>
                    <option value="background-color"></option>
                    <option>Right</option>
                    <option>Left</option>
                    <option>Both</option>
                </select><br><br>
            </div>

            <div class="form group">
                <label>Any Video Content</label><br>
                <input type="file" accept="video/mp4"><br>
                <small>(optional)</small>
            </div><br>
            <button>SUBMIT FORM</button>
        </form>
    </div>

     <div class="footer">
        <p>&copy;Jambazz FC</p>
        <i class='bx bxl-tiktok'></i>
        <i class='bx bxl-youtube' style="color: red;"></i>

        <i class='bx bxl-twitter' style="color: rgb(21, 157, 241);"></i>
        <i class='bx bxl-instagram' style="color: rgb(248, 37, 37);"></i>
        <i class='bx bxl-whatsapp' style="color: green;"></i>
        <i class='bx bxl-linkedin-square' style="color: rgb(3, 83, 132);"></i>
        <p style="font-size: x-large;">Made with <i class='bx bxs-heart' style="color: red;"></i> by Farouk.</p>

    </div>
    
</body>
</html>
